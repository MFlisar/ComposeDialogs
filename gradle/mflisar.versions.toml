[versions]

# general (local snapshot: "LOCAL-SNAPSHOT")
kmp-parcelize =             "2.0.0"
composecolors =             "2.0.0"

# plugins only
kmpicon-plugin =            "1.0.0"
kmpdevtools =               "9.3.0" # use the "devTools" task to change the version

# demos
democomposables =           "1.0.5"

[plugins]

# general
# --

# plugins only
kmpdevtools-buildplugin =           { id = "io.github.mflisar.kmpdevtools.plugins-build-gradle",        version.ref = "kmpdevtools" }
kmpicon-plugin =                    { id = "io.github.mflisar.kmpicon.plugin",                          version.ref = "kmpicon-plugin" }

[libraries]

# general
kmp-parcelize =                                 { module = "io.github.mflisar.kmpparcelize:library", 	                            version.ref = "kmp-parcelize" }
composecolors-material =						{ module = "io.github.mflisar.composecolors:material",      						version.ref = "composecolors" }
composecolors-material-palette =				{ module = "io.github.mflisar.composecolors:material-palette",      				version.ref = "composecolors" }

# demos
democomposables =                               { module = "io.github.mflisar.democomposables:library",                             version.ref = "democomposables" }