name: Update GitHub Pages
run-name: "[${{ github.event_name }}] Update GitHub Pages"

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-github-pages:
    uses: MFlisar/kmp-devtools/.github/workflows/reuseable-update-github-pages.yml@9.3.9
    with:
      config-file: .config.yml
