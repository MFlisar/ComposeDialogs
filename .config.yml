publish:
  group-id: io.github.mflisar.composedialogs
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central
  test-target: github

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

apps:
  - name: Toolbox Demo
    namespace: com.michaelflisar.composedialogs.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/android
      - demo/app/jvm
      - demo/app/wasm
      - demo/shared
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

project:
  namespace: com.michaelflisar.composedialogs
  repo-name: ComposeDialogs
  release: 2023
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

modules:
  primary-artifact-id: core
  modules:
    - artifact-id: core
      description: provides toolkit-neutral UI contracts and dialog events
      path: library/core
    - artifact-id: material3
      description: provides the Material 3 implementation of dialog UI
      path: library/implementation/material3
      internal: true
    - artifact-id: ui-color
      description: provides the color dialog UI
      path: library/ui/color
      internal: true
    - artifact-id: ui-date
      description: provides the date dialog UI
      path: library/ui/date
      internal: true
    - artifact-id: ui-info
      description: provides the info dialog UI
      path: library/ui/info
      internal: true
    - artifact-id: ui-input
      description: provides the input dialog UI
      path: library/ui/input
      internal: true
    - artifact-id: ui-list
      description: provides the list dialog UI
      path: library/ui/list
      internal: true
    - artifact-id: ui-menu
      description: provides the menu dialog UI
      path: library/ui/menu
      internal: true
    - artifact-id: ui-number
      description: provides the number picker dialog UI
      path: library/ui/number
      internal: true
    - artifact-id: ui-progress
      description: provides the progress dialog UI
      path: library/ui/progress
      internal: true
    - artifact-id: ui-time
      description: provides the time dialog UI
      path: library/ui/time
      internal: true
    - artifact-id: ui-frequency
      description: provides the frequency dialog UI
      path: library/ui/frequency
      internal: true
    - artifact-id: dialog-color
      description: provides a color dialog
      path: library/modules/color
    - artifact-id: dialog-date
      description: provides a date picker dialog
      path: library/modules/date
    - artifact-id: dialog-info
      description: provides an info dialog
      path: library/modules/info
    - artifact-id: dialog-input
      description: provides an input dialog
      path: library/modules/input
    - artifact-id: dialog-list
      description: provides a list dialog
      path: library/modules/list
    - artifact-id: dialog-menu
      description: provides a menu dialog
      path: library/modules/menu
    - artifact-id: dialog-number
      description: provides a number picker dialog
      path: library/modules/number
    - artifact-id: dialog-progress
      description: provides a progress dialog
      path: library/modules/progress
    - artifact-id: dialog-time
      description: provides a time dialog
      path: library/modules/time
    - artifact-id: dialog-frequency
      description: provides a frequency dialog (daily, weekly, monthly, yearly)
      path: library/modules/frequency
  xcframeworks: []

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
